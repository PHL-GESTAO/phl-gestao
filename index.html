<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHL Manutenção e Automação</title>
<style>
:root{--bg:#f3f7fb;--panel:#ffffff;--panel-alt:#f7faff;--panel-soft:#eef4ff;--border:#e2e8f0;--line:#dbe3ee;--text:#0f172a;--muted:#64748b;--subtle:#94a3b8;--primary:#0f6fff;--primary-dark:#0a4fb8;--primary-soft:#dfeeff;--success:#16a34a;--warning:#f59e0b;--danger:#ef4444;--sidebar:#091c2f;--sidebar-2:#122b43;--shadow:0 14px 30px rgba(15,23,42,.08);--radius:16px;--fn:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--fm:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--panel:#111827;--panel-alt:#162235;--panel-soft:#0f1d32;--border:#243244;--line:#1f2d3d;--text:#e2e8f0;--muted:#94a3b8;--subtle:#64748b;--primary:#60a5fa;--primary-dark:#3b82f6;--sidebar:#0a1220;--sidebar-2:#121f2d;--shadow:0 18px 32px rgba(2,6,23,.5)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);color:var(--text);background:radial-gradient(circle at top left,#f7fbff 0%,#edf4ff 25%,#f3f7fb 50%,#eef5f9 100%);line-height:1.5}
.app{display:flex;min-height:100vh;background:transparent}
.sidebar{width:220px;border-right:1px solid rgba(255,255,255,.06);padding:18px 12px 14px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar) 0%,var(--sidebar-2) 100%);box-shadow:inset -1px 0 0 rgba(255,255,255,.04)}
.brand{padding:14px 12px 18px;border:1px solid rgba(148,163,184,.18);border-radius:14px;background:rgba(255,255,255,.02);margin:2px 4px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.brand strong{display:block;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:#eff6ff;font-weight:800}
.brand small{display:block;font-size:9px;letter-spacing:.12em;color:#bfdbfe;margin-top:5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:13px;color:#dbeafe;transition:all .18s ease;margin-bottom:5px;border:1px solid transparent}
.nav-item:hover{background:rgba(148,163,184,.08);border-color:rgba(148,163,184,.12);transform:translateX(1px)}
.nav-item.active{background:linear-gradient(90deg,rgba(96,165,250,.22),rgba(96,165,250,.08));color:#fff;font-weight:600;border-color:rgba(96,165,250,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.nav-item svg{width:16px;height:16px;flex-shrink:0;color:#bfdbfe}
.main{flex:1;padding:28px 28px 32px;overflow-y:auto;max-width:1280px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px;padding:18px 20px;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.header h2{font-size:20px;font-weight:700;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease;box-shadow:0 4px 10px rgba(15,23,42,.03)}
.btn:hover{background:var(--panel-alt);transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;border-color:transparent;box-shadow:0 10px 18px rgba(15,111,255,.28)}
.btn-danger{color:var(--danger);border-color:rgba(239,68,68,.28)}
.btn-sm{padding:7px 12px;font-size:12px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.card{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:linear-gradient(180deg,#ffffff 0%,#fbfcff 100%);box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--primary) 0%,#38bdf8 45%,#14b8a6 100%)}
.card-label{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.card-value{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);letter-spacing:-.04em}
.cv-p{color:var(--success)}.cv-n{color:var(--danger)}
.chart-container{border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px;background:linear-gradient(180deg,#ffffff 0%,#f9fbff 100%);box-shadow:var(--shadow)}
.chart-title{font-size:14px;font-weight:700;margin-bottom:16px;color:var(--text)}
.chart-svg{width:100%;height:220px}
.table-wrap{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);box-shadow:var(--shadow)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);background:linear-gradient(180deg,#f8fbff 0%,#f4f8ff 100%);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text)}
.table tr:last-child td{border-bottom:none}
.table tr:hover{background:rgba(59,130,246,.03)}
.table .amount{font-variant-numeric:tabular-nums;font-weight:700}
.ai{color:var(--success)}.ae{color:var(--danger)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid transparent}
.bp{background:#fef3c7;color:#92400e}.ba{background:#dcfce7;color:#166534}.br{background:#fee2e2;color:#991b1b}.bc{background:#f3f4f6;color:#374151}
.bmaintenance{background:#dbeafe;color:#1e40af}.binstallation{background:#e0f2fe;color:#0f766e}.binspection{background:#dcfce7;color:#166534}.bpayment{background:#fee2e2;color:#991b1b}.bother{background:#f3f4f6;color:#6b7280}
.bm{background:#dbeafe;color:#1e40af}.bdel{background:#dcfce7;color:#166534}.bpy{background:#fee2e2;color:#991b1b}.bo{background:#f3f4f6;color:#6b7280}
.row-actions{opacity:0;transition:opacity .15s;display:flex;gap:4px}
tr:hover .row-actions,tr:focus-within .row-actions{opacity:1}
.icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:none;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:rgba(15,111,255,.08);color:var(--primary-dark)}
.icon-btn svg{width:14px;height:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.52);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s ease}
.modal-overlay.open{opacity:1;visibility:visible;pointer-events:auto}
.modal{background:linear-gradient(180deg,#ffffff 0%,#f9fbff 100%);border:1px solid var(--border);border-radius:22px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 24px 60px rgba(15,23,42,.25);transform:translateY(8px);transition:transform .18s ease}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{font-size:18px;font-weight:700;color:var(--text)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;font-family:var(--fn);box-shadow:inset 0 1px 2px rgba(15,23,42,.02)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:rgba(15,111,255,.5);box-shadow:0 0 0 4px rgba(15,111,255,.08)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--border)}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.filters{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--border);background:rgba(255,255,255,.72);border-radius:14px;box-shadow:var(--shadow)}
.filters input,.filters select{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;font-family:var(--fn)}
.totals-bar{display:flex;gap:16px;margin-bottom:16px;font-size:13px;flex-wrap:wrap;padding:12px 14px;background:linear-gradient(180deg,#f8fbff 0%,#f4f8ff 100%);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.totals-bar span{color:var(--muted)}.totals-bar b{font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;margin-top:8px;font-size:12px}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:50%}
.bar-income{fill:var(--success)}.bar-expense{fill:var(--danger)}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px}
.tab-btn{padding:6px 14px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-weight:500}
.tab-btn.active{background:var(--panel-soft);color:var(--primary)}
.tab-btn:hover:not(.active){background:var(--panel-alt)}
.report-box{background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;padding:16px;font-size:13px;line-height:1.8;white-space:pre-wrap;max-height:500px;overflow-y:auto;font-family:var(--fm)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-header{text-align:center;font-size:12px;color:var(--subtle);padding:8px;font-weight:500}
.cal-day{border:1px solid var(--border);border-radius:6px;padding:6px;min-height:72px;font-size:11px;cursor:pointer;transition:all .1s;background:var(--panel)}
.cal-day:hover{border-color:var(--primary)}.cal-day.today{background:#eff6ff;border-color:var(--primary)}
.cal-day-num{font-size:12px;font-weight:500;margin-bottom:4px}
.cal-event{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ce-maintenance{background:#dbeafe;color:#1e40af}.ce-installation{background:#e0f2fe;color:#0f766e}.ce-inspection{background:#dcfce7;color:#166534}.ce-payment{background:#fee2e2;color:#991b1b}.ce-other{background:#f3f4f6;color:#6b7280}
.doc-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;background:var(--panel)}
.doc-card:hover{border-color:var(--primary)}
.doc-info{flex:1;min-width:0}.doc-title{font-size:14px;font-weight:500;margin-bottom:3px}.doc-meta{font-size:12px;color:var(--subtle)}
.client-detail{border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;background:var(--panel)}
.client-detail h4{font-size:15px;font-weight:500;margin-bottom:10px}
.client-detail p{font-size:13px;color:var(--muted);margin-bottom:6px}
.sub-table{font-size:12px;width:100%}.sub-table th,.sub-table td{padding:6px 10px}.sub-table th{background:var(--panel-alt)}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.company-balance-card{margin-bottom:16px}.company-balance-card .balance-value{font-size:30px;font-weight:800}
@media(max-width:768px){.sidebar{width:60px;padding:8px 4px}.nav-item span{display:none}.nav-item{justify-content:center;padding:10px}.main{padding:12px}.three-col,.two-col{grid-template-columns:1fr}.modal{width:95vw}}

@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}



#auth-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f6fff 0%,#0a4fb8 52%,#091c2f 100%)}
.auth-card{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:36px;box-shadow:0 30px 80px rgba(2,6,23,.30)}
.auth-brand{text-align:center;margin-bottom:26px}.auth-logo{font-size:30px;font-weight:900;letter-spacing:.16em;color:#0f6fff}.auth-sub{font-size:12px;color:#64748b;text-transform:uppercase;font-weight:800;letter-spacing:.08em;margin-top:5px}.auth-badge{display:inline-block;margin-top:12px;padding:5px 11px;border-radius:999px;background:#dfeeff;color:#0f6fff;font-size:10px;font-weight:800;text-transform:uppercase}
.auth-form{display:flex;flex-direction:column;gap:14px}.auth-group label{display:block;font-size:11px;color:#64748b;text-transform:uppercase;font-weight:800;margin-bottom:6px}.auth-input{width:100%;padding:12px 14px;border:1px solid #dbe3ee;border-radius:12px;font-size:14px;outline:none;background:#f9fbff;color:#0f172a}.auth-input:focus{border-color:#0f6fff;box-shadow:0 0 0 4px rgba(15,111,255,.10);background:#fff}.auth-btn{width:100%;padding:12px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,#0f6fff,#0a4fb8);color:#fff;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 10px 24px rgba(15,111,255,.26)}.auth-btn:disabled{opacity:.65;cursor:not-allowed}.auth-link{border:0;background:none;color:#0f6fff;font-size:12px;font-weight:700;cursor:pointer;padding:4px 0;text-align:right}.auth-error{display:none;padding:10px;border-radius:9px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;text-align:center;font-size:12px}.auth-error.show{display:block}.auth-success{display:none;padding:10px;border-radius:9px;background:#dcfce7;color:#166534;border:1px solid #bbf7d0;text-align:center;font-size:12px}.auth-success.show{display:block}.auth-footer{text-align:center;margin-top:18px;font-size:11px;color:#94a3b8}.auth-config{margin-top:12px;font-size:10px;color:#b45309;text-align:center}


/* ===== PHL: leitura mais nítida / alto contraste ===== */
:root{
  --text:#07101f;
  --muted:#334155;
  --subtle:#475569;
  --border:#cbd5e1;
  --line:#cbd5e1;
}
html{font-size:16px}
body{
  color:var(--text);
  font-weight:500;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:auto;
  background:#f3f7fb;
}
.header h2,.modal-header h3,.chart-title,.doc-title,.client-detail h4{color:#07101f;font-weight:800}
.nav-item{font-size:14px;font-weight:600;color:#eff6ff}
.nav-item.active{font-weight:800}
.card-label,.form-group label,.table th,.tab-btn{color:#334155;font-weight:800}
.card-value{color:#07101f;font-weight:900}
.table{font-size:14px}
.table td{color:#111827;font-weight:550}
.table th{font-size:12px;color:#334155;background:#eef4fb}
.filters input,.filters select,.form-group input,.form-group select,.form-group textarea{color:#0f172a;font-weight:600;border-color:#cbd5e1;background:#fff}
.filters input::placeholder,.form-group input::placeholder,.form-group textarea::placeholder{color:#64748b;opacity:1}
.totals-bar{font-size:14px;color:#334155}
.totals-bar b{color:#0f172a;font-weight:900;margin-left:4px}
.report-box{font-size:14px;line-height:1.75;color:#0f172a;background:#fff;border-color:#cbd5e1;font-weight:600}
.empty-state,.doc-meta,.client-detail p{color:#475569}
.badge{font-size:12px;font-weight:800}
.tx-receivable{color:#b45309!important;font-weight:900}
.badge-receivable{background:#ffedd5;color:#9a3412;border-color:#fdba74}
.week-controls{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:14px;padding:12px;border:1px solid var(--border);border-radius:14px;background:#fff}
.week-controls .form-group{margin:0;min-width:190px}
@media(max-width:768px){html{font-size:15px}.table{font-size:13px}.week-controls{align-items:stretch}.week-controls .form-group{width:100%}}


/* ===== PHL: padronização de TODOS os botões ===== */
button,
.btn,
.btn-primary,
.btn-danger,
.btn-sm,
.icon-btn,
.tab-btn,
.login-button,
.phl-login-btn,
a.btn,
a.btn.btn-sm,
.row-actions button,
.modal-footer button,
.week-controls button{
  background:#0f6fff !important;
  background-image:none !important;
  color:#ffffff !important;
  border-color:#0f6fff !important;
  box-shadow:none !important;
  font-weight:800 !important;
}

button:hover,
.btn:hover,
.btn-primary:hover,
.btn-danger:hover,
.btn-sm:hover,
.icon-btn:hover,
.tab-btn:hover,
.tab-btn.active,
.login-button:hover,
.phl-login-btn:hover,
a.btn:hover,
a.btn.btn-sm:hover,
.row-actions button:hover,
.modal-footer button:hover,
.week-controls button:hover{
  background:#0a4fb8 !important;
  background-image:none !important;
  color:#ffffff !important;
  border-color:#0a4fb8 !important;
  transform:none !important;
}

button:focus,
.btn:focus,
.icon-btn:focus,
.tab-btn:focus,
.phl-login-btn:focus{
  outline:none !important;
  box-shadow:0 0 0 3px rgba(15,111,255,.22) !important;
}

button svg,
.btn svg,
.icon-btn svg,
.row-actions button svg{
  color:#ffffff !important;
  fill:currentColor;
}

/* Botões pequenos de editar/excluir ficam azuis com ícone branco */
.icon-btn{
  width:30px !important;
  height:30px !important;
  border-radius:8px !important;
}

/* Abas também usam o mesmo padrão azul */
.tabs{
  gap:8px !important;
  border-bottom:none !important;
}
.tab-btn{
  border-radius:9px !important;
  padding:8px 14px !important;
}

/* Links que funcionam como botão seguem o mesmo padrão */
a.btn{
  text-decoration:none !important;
}

/* Mantém inputs e selects com fundo claro — só botões ficam azuis */
.filters select,
.filters input,
.form-group input,
.form-group select,
.form-group textarea{
  background:#ffffff !important;
  color:#0f172a !important;
}

</style>
<base target="_self">
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">PHL</div>
      <div class="auth-sub">Manutenção e Automação</div>
      <div class="auth-badge">Sistema de Gestão</div>
    </div>
    <form id="auth-form" class="auth-form" action="javascript:void(0)" method="post" target="_self">
      <div class="auth-group"><label for="auth-email">E-mail</label><input id="auth-email" class="auth-input" type="email" autocomplete="username" required placeholder="seuemail@empresa.com"></div>
      <div class="auth-group"><label for="auth-password">Senha</label><input id="auth-password" class="auth-input" type="password" autocomplete="current-password" required minlength="8" placeholder="Mínimo de 8 caracteres"></div>
      <div id="auth-error" class="auth-error"></div>
      <div id="auth-success" class="auth-success"></div>
      <button id="auth-submit" class="auth-btn" type="submit">Entrar no sistema</button>
      <button id="forgot-password" class="auth-link" type="button">Esqueci minha senha</button>
    </form>
    <div class="auth-footer">Autenticação protegida por Supabase Auth</div>
    <div id="auth-config-warning" class="auth-config" style="display:none">Configure as credenciais do Supabase no arquivo supabase-config.js.</div>
  </div>
</div>


<div class="app" id="app-container" style="display:none">
<aside class="sidebar">

function getMonthly(){
const months={};const now=new Date();
for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months[k]={label:d.toLocaleString('pt-BR',{month:'short'}).replace('.',''),income:0,expense:0}}

return Object.values(months);
}

function viewCl(id){cview=id;render()}
function openCl(id){etype='cl';eid=id||null;const cl=id?data.clients.find(x=>x.id===id):{};document.getElementById('modal-title').textContent=id?'Editar cliente':'Novo cliente';document.getElementById('modal-body').innerHTML=`<div class="form-row"><div class="form-group"><label>Nome</label><input type="text" id="cl-name" value="${cl.name||''}"></div><div class="form-group"><label>CNPJ</label><input type="text" id="cl-cnpj" value="${cl.cnpj||''}" placeholder="00.000.000/0000-00"></div></div><div class="form-row"><div class="form-group"><label>E-mail</label><input type="email" id="cl-email" value="${cl.email||''}"></div><div class="form-group"><label>Telefone</label><input type="text" id="cl-phone" value="${cl.phone||''}" placeholder="(00) 00000-0000"></div></div><div class="form-group"><label>Endereço</label><input type="text" id="cl-address" value="${cl.address||''}"></div><div class="form-group"><label>Observações</label><textarea id="cl-notes">${cl.notes||''}</textarea></div>`;const overlay=document.getElementById('modal-overlay');if(overlay){overlay.classList.add('open');document.body.style.overflow='hidden';}}

function delCl(id){if(confirm('Excluir cliente? Isso não remove transações vinculadas.')){data.clients=data.clients.filter(c=>c.id!==id);sd();render()}}

function rl(c){
const y=calD.getFullYear(),m=calD.getMonth();
const firstDay=new Date(y,m,1).getDay();
const daysInMonth=new Date(y,m+1,0).getDate();
const today=new Date().toISOString().split('T')[0];
const monthLabel=calD.toLocaleString('pt-BR',{month:'long',year:'numeric'});
let daysHtml='';
for(let i=0;i<firstDay;i++)daysHtml+=`<div class="cal-day" style="background:transparent;border-color:transparent;cursor:default"></div>`;
for(let d=1;d<=daysInMonth;d++){
const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const evs=data.events.filter(e=>e.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
const isToday=ds===today;
daysHtml+=`<div class="cal-day ${isToday?'today':''}" onclick="openEv(null,'${ds}')"><div class="cal-day-num">${d}</div>${evs.map(e=>`<div class="cal-event ce-${eventTypeClass(e.type)}" onclick="event.stopPropagation();editEv('${e.id}')">${e.time} ${e.title}</div>`).join('')}</div>`;
}

function localDateKey(d){
const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
return `${y}-${m}-${day}`;
}
function weekBounds(dateValue){
const base=dateValue?new Date(dateValue+'T12:00:00'):new Date();
const day=base.getDay();
const diff=day===0?-6:1-day;
const start=new Date(base);start.setDate(base.getDate()+diff);start.setHours(0,0,0,0);
const end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);
return {start,end};
}
function shiftWeek(days){
const input=document.getElementById('week-reference');if(!input)return;
const d=new Date((input.value||localDateKey(new Date()))+'T12:00:00');d.setDate(d.getDate()+days);input.value=localDateKey(d);renderWeeklyReport(input.value);
}

async function readPdfFile(file){
  return new Promise((resolve,reject)=>{
    if(!file){resolve(null);return}
    if(file.type && !file.type.includes('pdf')){reject(new Error('Selecione um arquivo PDF válido.'));return}
    if(file.size > 4 * 1024 * 1024){reject(new Error('O arquivo PDF deve ter no máximo 4 MB.'));return}
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('Não foi possível ler o arquivo PDF.'));
    reader.readAsDataURL(file);
  });
}

  }

function configLooksValid(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return false;
  const placeholders=['COLE_AQUI','SEU_PROJETO','SUA_CHAVE','URL_DO_SEU','CHAVE_PUBLICA'];
  if(placeholders.some(p=>SUPABASE_URL.toUpperCase().includes(p)||SUPABASE_ANON_KEY.toUpperCase().includes(p))) return false;
  try{
    const u=new URL(SUPABASE_URL);
    if(!['https:','http:'].includes(u.protocol)) return false;
  }catch(e){ return false; }
  return SUPABASE_ANON_KEY.length>20;
}

  }catch(err){
    console.error('Falha ao iniciar Supabase:',err);
    setConfigWarning('Não foi possível iniciar o Supabase. Confira se a Project URL está no formato https://SEU-PROJETO.supabase.co e se a Publishable key está correta.');
  }
}

async function showAppForUser(user){
  currentUser=user;
  if(authScreen) authScreen.style.display='none';
  if(appContainer) appContainer.style.display='flex';
  await loadCloudData();
  render();
}
async function loadCloudData(){
  cloudReady=false;
  if(!window.supabaseClient || !currentUser) return;
  try{
    const {data:membership,error:membershipError}=await window.supabaseClient
      .from('company_members')
      .select('role')
      .eq('company_id',PHL_COMPANY_ID)
      .eq('user_id',currentUser.id)
      .maybeSingle();

    if(membershipError){
      console.error('Falha ao verificar vínculo com a empresa:',membershipError);
      showAuthError('Login realizado, mas não foi possível verificar seu acesso à empresa PHL.');
      return;
    }

    if(!membership){
      if(appContainer) appContainer.style.display='none';
      if(authScreen) authScreen.style.display='flex';
      showAuthError('Este usuário existe, mas ainda não foi autorizado a acessar os dados da PHL.');
      return;
    }

    currentRole=membership.role||'member';

    const {data:row,error}=await window.supabaseClient
      .from('company_data')
      .select('data,updated_at')
      .eq('company_id',PHL_COMPANY_ID)
      .maybeSingle();

    if(error){
      console.error(error);
      showAuthError('Login realizado, mas o banco compartilhado da PHL não pôde ser carregado. Execute o arquivo MIGRACAO_PHL_COMPARTILHADA.sql no Supabase.');
      return;
    }

    if(row && row.data){
      data=normalizeData(row.data);
      localStorage.setItem(SK,JSON.stringify(data));
    }else{
      data=normalizeData(ld());
      cloudReady=true;
      await sd();
    }

    cloudReady=true;
    subscribeCompanyRealtime();
  }catch(err){
    console.error('Erro ao carregar dados compartilhados:',err);
    showAuthError('Login realizado, mas houve falha ao acessar os dados compartilhados da PHL.');
  }
}

function subscribeCompanyRealtime(){
  if(!window.supabaseClient || !currentUser) return;

  if(companyRealtimeChannel){
    try{window.supabaseClient.removeChannel(companyRealtimeChannel)}catch(e){}
    companyRealtimeChannel=null;
  }

  companyRealtimeChannel=window.supabaseClient
    .channel('phl-company-data')
    .on(
      'postgres_changes',
      {
        event:'UPDATE',
        schema:'public',
        table:'company_data',
        filter:`company_id=eq.${PHL_COMPANY_ID}`
      },
      payload=>{
        const incoming=payload?.new?.data;
        if(!incoming) return;
        data=normalizeData(incoming);
        localStorage.setItem(SK,JSON.stringify(data));
        if(document.visibilityState==='visible') render();
      }
    )
    .subscribe();
}

async function phlLogout(){
  if(!window.supabaseClient) return;
  if(!confirm('Deseja sair do sistema?')) return;
  try{
    const {error}=await window.supabaseClient.auth.signOut({scope:'local'});
    if(error){alert('Não foi possível sair: '+error.message);return;}
    cloudReady=false;
    currentUser=null;
    currentRole=null;
    if(companyRealtimeChannel){
      try{window.supabaseClient.removeChannel(companyRealtimeChannel)}catch(e){}
      companyRealtimeChannel=null;
    }
    showAuth();
  }catch(err){alert('Não foi possível sair do sistema.');}
}

(function addUserMenu(){
  const sidebar=document.querySelector('.sidebar');
  if(!sidebar || document.getElementById('phl-real-logout')) return;
  const item=document.createElement('div');
  item.className='nav-item';item.id='phl-real-logout';item.style.cssText='margin-top:auto;background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2);color:#ef4444';
  item.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M10 3H7c-2.2 0-4 1.8-4 4v10c0 2.2 1.8 4 4 4h3m10-6l3-3m0 0l-3-3m3 3H10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sair</span>';
  item.onclick=phlLogout;sidebar.appendChild(item);
})();

function friendlyAuthError(error){
  const msg=String(error?.message||error||'');
  if(/invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if(/email not confirmed/i.test(msg)) return 'Seu e-mail ainda não foi confirmado no Supabase.';
  if(/failed to fetch|network|fetch/i.test(msg)) return 'Não foi possível conectar ao Supabase. Verifique a internet, a Project URL e tente novamente.';
  if(/invalid api key|apikey/i.test(msg)) return 'A Publishable key do Supabase está incorreta.';
  return msg || 'Não foi possível entrar. Verifique os dados e tente novamente.';
}

async function loginWithTimeout(email,password){
  const loginPromise=window.supabaseClient.auth.signInWithPassword({email,password});
  const timeoutPromise=new Promise((_,reject)=>setTimeout(()=>reject(new Error('Tempo limite de conexão excedido.')),20000));
  return Promise.race([loginPromise,timeoutPromise]);
}

if(authForm){
  authForm.addEventListener('submit',async e=>{
    e.preventDefault();
    e.stopPropagation();
    clearAuthMessages();
    if(!window.supabaseClient){
      showAuthError(authInitError || 'O Supabase não foi inicializado. Confira o arquivo supabase-config.js.');
      return false;
    }
    const email=(authEmail?.value||'').trim();
    const password=authPassword?.value||'';
    if(!email || !password){showAuthError('Digite seu e-mail e sua senha.');return false;}
    if(authSubmit){authSubmit.disabled=true;authSubmit.textContent='Entrando...';}
    try{
      const {data:result,error}=await loginWithTimeout(email,password);
      if(error){showAuthError(friendlyAuthError(error));return false;}
      if(!result?.user){showAuthError('O Supabase não retornou um usuário para esta conta.');return false;}
      showAuthSuccess('Login confirmado. Carregando sistema...');
      await showAppForUser(result.user);
    }catch(err){
      console.error('Erro no login:',err);
      showAuthError(friendlyAuthError(err));
    }finally{
      if(authSubmit){authSubmit.disabled=false;authSubmit.textContent='Entrar no sistema';}
    }
    return false;
  });
}else{
  console.error('Formulário de login não encontrado.');
}

if(forgotPassword){
  forgotPassword.addEventListener('click',async()=>{
    clearAuthMessages();
    if(!window.supabaseClient){showAuthError(authInitError || 'Configure o Supabase antes de usar a recuperação de senha.');return;}
    const email=(authEmail?.value||'').trim();
    if(!email){showAuthError('Digite seu e-mail para receber o link de recuperação.');authEmail?.focus();return;}
    try{
      const redirectTo=(window.location.protocol==='file:') ? undefined : window.location.origin+window.location.pathname;
      const {error}=await window.supabaseClient.auth.resetPasswordForEmail(email, redirectTo?{redirectTo}:undefined);
      if(error){showAuthError(friendlyAuthError(error));return;}
      showAuthSuccess('Se existir uma conta para esse e-mail, você receberá as instruções para redefinir a senha.');
    }catch(err){showAuthError(friendlyAuthError(err));}
  });
}

if(window.supabaseClient){
  window.supabaseClient.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_OUT'){
      currentUser=null;currentRole=null;cloudReady=false;
      if(companyRealtimeChannel){
        try{window.supabaseClient.removeChannel(companyRealtimeChannel)}catch(e){}
        companyRealtimeChannel=null;
      }
      showAuth();return;
    }
    if(session?.user && !currentUser){await showAppForUser(session.user);}
    if(event==='PASSWORD_RECOVERY') handlePasswordRecovery();
  });
  (async function initRealAuth(){
    try{
      const {data:authData,error}=await window.supabaseClient.auth.getSession();
      if(error) console.warn('Sessão não carregada:',error);
      if(authData?.session?.user){await showAppForUser(authData.session.user);}else{showAuth();}
    }catch(err){console.error(err);showAuth();}
  })();
}else{
  showAuth();
}

async function handlePasswordRecovery(){
  if(!window.supabaseClient) return;
  const newPassword=prompt('Digite sua nova senha (mínimo de 8 caracteres):');
  if(!newPassword) return;
  if(newPassword.length<8){alert('A senha deve ter pelo menos 8 caracteres.');return;}
  const {error}=await window.supabaseClient.auth.updateUser({password:newPassword});
  if(error) alert('Não foi possível alterar a senha: '+error.message);
  else {alert('Senha alterada com sucesso.'); const r=await window.supabaseClient.auth.getUser(); if(r.data?.user) await showAppForUser(r.data.user);}
}

// Se algum erro JavaScript ocorrer enquanto a tela de login estiver aberta, mostre-o ao usuário.
window.addEventListener('error',ev=>{
  if(authScreen && authScreen.style.display!=='none'){
    console.error(ev.error||ev.message);
    if(!authError?.classList.contains('show')) showAuthError('O site encontrou um erro ao iniciar. Pressione Ctrl+F5 e, se continuar, confira o supabase-config.js.');
  }
});
window.addEventListener('unhandledrejection',ev=>{
  console.error(ev.reason);
});
